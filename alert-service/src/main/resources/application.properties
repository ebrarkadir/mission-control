spring.application.name=alert-service

server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5434/alert_service
spring.datasource.username=alert_service
spring.datasource.password=alert_service_dev

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:mission_control}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:mission_control_dev}