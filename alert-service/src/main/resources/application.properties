spring.application.name=alert-service

server.port=8082

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/alert_service}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:alert_service}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:alert_service_dev}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

app.core.base-url=${CORE_SERVICE_URL:http://localhost:8080}
app.telemetry.base-url=${TELEMETRY_SERVICE_URL:http://localhost:8081}
app.internal-api-key=${INTERNAL_API_KEY}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:mission_control}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:mission_control_dev}

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false