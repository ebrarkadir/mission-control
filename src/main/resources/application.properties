spring.application.name=mission-control

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mission_control}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:mission_control}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mission_control_dev}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=3600

app.bootstrap-admin.name=${BOOTSTRAP_ADMIN_NAME:}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

app.internal-api-key=${INTERNAL_API_KEY}